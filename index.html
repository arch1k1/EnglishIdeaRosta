*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 4px}
.sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}

.panel{display:none}.panel.on{display:block}

.score{font-weight:600}
.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--ac);background:var(--ac);color:var(--bg);cursor:pointer;font-size:14px}
.btn.ghost{background:transparent;color:var(--tx);border-color:var(--bd)}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.qt{font-weight:600;margin-bottom:8px}
.qt .n{color:var(--mut);font-weight:400;margin-right:6px}
.blank{display:inline-block;min-width:60px;border-bottom:2px solid var(--mut)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opts button{padding:10px;border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:10px;font-size:15px;text-align:left;cursor:pointer}
.opts button.ok{background:var(--ok);border-color:var(--okb)}
.opts button.bad{background:var(--bad);border-color:var(--badb)}
.opts button:disabled{cursor:default}
.hint{color:var(--mut);font-size:13px}
input[type=text]{width:100%;margin-top:6px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
input.ok{background:var(--ok);border-color:var(--okb)}input.bad{background:var(--bad);border-color:var(--badb)}
.ans{font-size:13px;color:var(--badb);margin-top:4px}

.card small{font-size:12px;color:var(--mut);font-weight:400;margin-bottom:8px;letter-spacing:.1em}
.row{display:flex;gap:8px;margin-bottom:14px}.row .btn{flex:1}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pg button{padding:12px 8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px;cursor:pointer}
.pg button.sel{border:2px solid var(--ac)}
.pg button.ok{background:var(--ok);border-color:var(--okb);opacity:.7}
.pg button.bad{background:var(--bad);border-color:var(--badb)}

.top button{font-weight:600}
select.gs{padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin-bottom:12px;font-size:15px}

const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const norm=s=>s.toLowerCase().replace(/[-–]/g," ").replace(/[’`]/g,"'").replace(/\s+/g," ").trim();
const mk=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const BL='<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>';
let CURA=null;
function say(t){const k=t.split(" / ")[0].replace(/^to /,"");try{if(CURA)CURA.pause();if(AUD[k]){CURA=new Audio("data:audio/mpeg;base64,"+AUD[k]);CURA.play();return}const u=new SpeechSynthesisUtterance(k);u.lang="en-US";u.rate=0.9;const V=speechSynthesis.getVoices().filter(x=>/^en[-_]US/i.test(x.lang)),v=["Natural","Neural","Premium","Enhanced","Samantha","Aria","Google US"].map(n=>V.find(x=>x.name.includes(n))).find(Boolean)||V[0];if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

function mcq(box,items){
  box.innerHTML="";let done=0,right=0;const wrong=[];
  const bar=mk("div","bar");const sc=mk("span","score","Верно: 0 / "+items.length);
  const rs=mk("button","btn ghost","Заново");bar.append(sc,rs);box.append(bar);
  rs.onclick=()=>box.dispatchEvent(new Event("reset"));
  items.forEach((it,i)=>{
    const q=mk("div","q");q.append(mk("div","qt",`<span class="n">${i+1}.</span>${it.q}`));
    const o=mk("div","opts");
    it.opts.forEach(t=>{
      const b=mk("button","",t);
      b.onclick=()=>{
        o.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.textContent===it.ans)x.classList.add("ok")});
        if(t===it.ans)right++;else{b.classList.add("bad");wrong.push(it)}
        done++;sc.textContent=`Верно: ${right} / ${items.length}`+(done===items.length?" — готово!":"");
        if(done===items.length&&wrong.length){
          const r=mk("button","btn","Повторить ошибки ("+wrong.length+")");r.style.marginBottom="20px";
          r.onclick=()=>{mcq(box,wrong.map(x=>({...x,opts:sh(x.opts)})));window.scrollTo(0,0)};box.append(r);
        }
      };o.append(b);
    });
    q.append(o);box.append(q);
  });
}
function typed(box,list){
  box.innerHTML="";const items=sh(list);const ins=[];
  const bar=mk("div","bar");const sc=mk("span","score","Впиши слово или форму по-английски");
  const rs=mk("button","btn ghost","Заново");bar.append(sc,rs);box.append(bar);
  rs.onclick=()=>box.dispatchEvent(new Event("reset"));
  items.forEach((it,i)=>{
    const q=mk("div","q");
    q.append(mk("div","qt",`<span class="n">${i+1}.</span>${it[0].replace("___",BL)}`));
    q.append(mk("div","hint",it[1].split(" · ").pop()));
    const inp=mk("input");inp.type="text";inp.autocomplete="off";inp.autocapitalize="off";inp.spellcheck=false;
    const a=mk("div","ans");q.append(inp,a);box.append(q);ins.push([inp,a,it]);
  });
  const chk=mk("button","btn","Проверить всё");chk.style.marginBottom="20px";
  chk.onclick=()=>{let r=0;ins.forEach(([inp,a,it])=>{const ok=it[2].map(norm).includes(norm(inp.value));inp.className=ok?"ok":"bad";a.textContent=ok?"":"Правильно: "+(it[3]||it[2][0]);if(ok)r++});sc.textContent=`Верно: ${r} / ${items.length}`};
  box.append(chk);
}
function cards(box,words){
  let deck=sh(words),i=0,flip=false,known=0,miss=[];
  const draw=()=>{
    box.innerHTML="";
    if(i>=deck.length){
      box.append(mk("div","q",`<div class="qt">Круг закончен. Знаю: ${known}, повторить: ${miss.length}</div>`));
      const row=mk("div","row");
      if(miss.length){const b=mk("button","btn","Повторить незнакомые");b.onclick=()=>{deck=sh(miss);miss=[];i=0;known=0;flip=false;draw()};row.append(b)}
      const r=mk("button","btn ghost","Все слова заново");r.onclick=()=>box.dispatchEvent(new Event("reset"));row.append(r);box.append(row);return;
    }
    const w=deck[i];
    box.append(mk("div","bar",`<span class="score">${i+1} / ${deck.length}</span><span class="hint">нажми на карточку, чтобы перевернуть</span>`));
    const c=mk("div","card",flip?`<small>EN</small>${w[1]}`:`<small>RU</small>${w[0]}`);
    c.onclick=()=>{flip=!flip;if(flip)say(w[1]);draw()};box.append(c);
    if(flip){
      const row=mk("div","row");
      const no=mk("button","btn ghost","Не знаю");no.onclick=()=>{miss.push(w);i++;flip=false;draw()};
      const yes=mk("button","btn","Знаю");yes.onclick=()=>{known++;i++;flip=false;draw()};
      const sp=mk("button","btn ghost","🔊");sp.style.flex="0 0 56px";sp.onclick=()=>say(w[1]);
      row.append(no,sp,yes);box.append(row);
    }
  };
  draw();
}
function pairs(box,words){
  const ws=sh(words),rounds=[];for(let k=0;k<ws.length;k+=6)rounds.push(ws.slice(k,k+6));
  let r=0,err=0;
  const draw=()=>{
    box.innerHTML="";
    if(r>=rounds.length){box.append(mk("div","q",`<div class="qt">Все пары собраны! Ошибок: ${err}</div>`));const b=mk("button","btn","Заново");b.onclick=()=>box.dispatchEvent(new Event("reset"));box.append(b);return}
    const set=rounds[r];
    box.append(mk("div","bar",`<span class="score">Раунд ${r+1} / ${rounds.length}</span><span class="hint">ошибок: ${err}</span>`));
    const g=mk("div","pg");let sel=null,left=set.length;
    const Lb=sh(set).map(w=>{const b=mk("button","",w[0]);b.w=w;return b});
    const Rb=sh(set).map(w=>{const b=mk("button","",w[1]);b.w=w;return b});
    const lc=mk("div"),rc=mk("div");[lc,rc].forEach(c=>{c.style.display="grid";c.style.gap="8px"});
    Lb.forEach(b=>{b.onclick=()=>{if(b.classList.contains("ok"))return;Lb.forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel=b}});
    Rb.forEach(b=>{b.onclick=()=>{
      if(b.classList.contains("ok")||!sel)return;
      if(sel.w===b.w){sel.className="ok";b.className="ok";sel=null;left--;say(b.w[1]);if(left===0)setTimeout(()=>{r++;draw()},700)}
      else{err++;b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),400)}
    }});
    lc.append(...Lb);rc.append(...Rb);g.append(lc,rc);box.append(g);
  };
  draw();
}
function listv(box,words){
  box.innerHTML="";
  box.append(mk("div","bar",`<span class="score">${words.length} слов</span><span class="hint">🔊 — послушать</span>`));
  const t=mk("div","q");t.style.padding="4px 12px";
  words.forEach((w,i)=>{
    const r=mk("div");r.style.cssText="display:flex;align-items:center;gap:10px;padding:10px 0;"+(i?"border-top:1px solid var(--bd)":"");
    const b=mk("button","btn ghost","🔊");b.style.cssText="padding:4px 10px;flex:0 0 auto";b.onclick=()=>say(w[1]);
    const e=mk("b","",w[1]);e.style.flex="1";
    const ru=mk("span","",w[0]);ru.style.cssText="flex:1;text-align:right";
    r.append(b,e,ru);t.append(r);
  });
  box.append(t);
}
const wq=(L,words,idx)=>{const f=idx?1:0,t=idx?0:1;return sh(words).map(w=>({q:w[f],ans:w[t],opts:sh([w[t],...sh(L.W.filter(x=>x[t]!==w[t])).slice(0,3).map(x=>x[t])])}))};
const sq=L=>sh(L.S).map(s=>({q:s[0].replace("___",BL),ans:s[1],opts:sh([s[1],...s[2]])}));
const pq=L=>sh(L.P).map(p=>({q:p[0],ans:p[1],opts:sh([p[1],...p[2]])}));
const gq=()=>sh(GQ).map(g=>({q:g[0].replace("___",BL),ans:g[1],opts:sh([g[1],...g[2]])}));

function tabsView(root,tabs){
  const tb=mk("div","tabs"),pn=mk("div");
  tabs.forEach(([name,fn],i)=>{
    const b=mk("button",i?"":"on",name),p=mk("div","panel"+(i?"":" on"));
    p.dirty=true;
    const show=()=>{if(p.dirty){fn(p);p.dirty=false}};
    p.addEventListener("reset",()=>{p.dirty=true;if(p.classList.contains("on"))show()});
    b.onclick=()=>{[...tb.children].forEach(x=>x.classList.remove("on"));[...pn.children].forEach(x=>x.classList.remove("on"));b.classList.add("on");p.classList.add("on");show();window.scrollTo(0,0)};
    tb.append(b);pn.append(p);if(!i)show();
  });
  root.append(tb,pn);return pn;
}
const resetAll=pn=>[...pn.children].forEach(p=>p.dispatchEvent(new Event("reset")));

function lessonView(L,root){
  let gr="all";
  const cur=()=>gr==="all"?L.W:L.W.filter(w=>w[2]===gr);
  const sel=mk("select","gs",L.groups.map(g=>`<option value="${g[0]}">${g[1]}</option>`).join(""));
  root.append(sel);
  const pn=tabsView(root,[
    ["🃏 Карточки",b=>cards(b,cur())],["🔗 Пары",b=>pairs(b,cur())],
    ["RU → EN",b=>mcq(b,wq(L,cur(),0))],["EN → RU",b=>mcq(b,wq(L,cur(),1))],
    ["Предложения: выбор",b=>mcq(b,sq(L))],["Предложения: впиши",b=>typed(b,L.T)],
    ["📋 Список",b=>listv(b,cur())],["Перевод фраз",b=>mcq(b,pq(L))]
  ]);
  sel.onchange=()=>{gr=sel.value;resetAll(pn)};
}
function gramView(root){
  tabsView(root,[["📘 Правила",b=>{b.innerHTML=RULES}],["Выбор",b=>mcq(b,gq())],["Впиши форму",b=>typed(b,GT)]]);
}
function bigView(root){
  let N=40;
  const tag=(L,items)=>items.map(x=>({...x,q:`<span class="hint">${L.emoji}</span> `+x.q}));
  const pick=a=>{a=sh(a);return N?a.slice(0,N):a};
  const one=idx=>{let p=[];LESSONS.forEach(L=>p.push(...tag(L,wq(L,L.W,idx))));return pick(p)};
  const mixed=()=>{let p=[];LESSONS.forEach(L=>p.push(...tag(L,wq(L,L.W,0)),...tag(L,wq(L,L.W,1))));return pick(p)};
  const typedW=()=>{let p=[];LESSONS.forEach(L=>L.W.forEach(w=>{const al=[w[1],...w[1].split(" / "),w[1].replace(/^to /,""),...(L.ALT[w[1]]||[])];p.push([L.emoji+" "+w[0],"переведи на английский",al,w[1]])}));return pick(p)};
  const total=LESSONS.reduce((s,L)=>s+L.W.length,0);
  root.append(mk("p","sub",`Только слова изо всех уроков (сейчас ${LESSONS.length} урока, ${total} слов). Новый урок добавится сам.`));
  const sel=mk("select","gs",'<option value="20">20 вопросов</option><option value="40" selected>40 вопросов</option><option value="80">80 вопросов</option><option value="0">Все слова</option>');
  root.append(sel);
  const pn=tabsView(root,[["RU → EN",b=>mcq(b,one(0))],["EN → RU",b=>mcq(b,one(1))],["Микс RU/EN",b=>mcq(b,mixed())],["Впиши слово",b=>typed(b,typedW())]]);
  sel.onchange=()=>{N=+sel.value;resetAll(pn)};
}
const SECTIONS=[...LESSONS.map((L,i)=>[L.emoji+" "+L.title+(i===LESSONS.length-1?" (последнее)":""),r=>lessonView(L,r)]),["📖 Грамматика",gramView],["🏆 Общий тест",bigView]];
const topBar=document.getElementById("top"),view=document.getElementById("view");
SECTIONS.forEach(([name,fn],i)=>{
  const b=mk("button",i?"":"on",name),d=mk("div","panel"+(i?"":" on"));d.built=false;
  const show=()=>{if(!d.built){fn(d);d.built=true}};
  b.onclick=()=>{[...topBar.children].forEach(x=>x.classList.remove("on"));[...view.children].forEach(x=>x.classList.remove("on"));b.classList.add("on");d.classList.add("on");show();window.scrollTo(0,0)};
  topBar.append(b);view.append(d);if(!i)show();
});

</script></body></html>
